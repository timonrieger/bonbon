AWSTemplateFormatVersion: "2010-09-09"
# LanguageExtensions first: it resolves !If in DeletionPolicy/UpdateReplacePolicy (Database),
# which plain CloudFormation doesn't allow.
Transform: [AWS::LanguageExtensions, AWS::Serverless-2016-10-31]
Description: Bonbon, receipt digitization for shared households

# Learner Lab rules (see docs/decisions/0001-learner-lab-constraints.md):
# - NEVER create IAM roles or policies (no AWS::IAM::*, no `Policies:` on functions).
#   Every function must set `Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole`
#   (SAM does not allow Role in Globals; .mise/tasks/check-no-iam.py enforces this).
# - Region is always us-east-1.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  # The database and the Lambdas that use it live in the account's default VPC.
  # Looked up by .mise/tasks/stack-params.py, as are RouteTableIds and CreateS3Endpoint.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The account's default VPC
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Default-VPC subnets for Lambdas and the database (without use1-az3, which Lambda doesn't support)
  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables of the default VPC, for the S3 gateway endpoint
  # false if the VPC already has an S3 gateway endpoint from outside this stack (ADR 0007).
  # A VPC can't have two for the same route table, and an existing one is never touched.
  CreateS3Endpoint:
    Type: String
    AllowedValues: ["true", "false"]
  # Dev-only Textract mock (#35): "1" makes ProcessReceiptFunction skip the real AnalyzeExpense
  # call and return a stored response instead. Default "0" (off); only the dev stack sets it to
  # "1" (see .mise). Never enabled on prod.
  TextractMock:
    Type: String
    AllowedValues: ["0", "1"]
    Default: "0"

  # Mock delay in milliseconds (#35): how long the mocked AnalyzeExpense call sleeps, to imitate
  # the real Textract latency. Only used when TextractMock is "1". ~3.3 s by default.
  TextractMockDelayMs:
    Type: String
    Default: "3300"

Conditions:
  CreateS3Endpoint: !Equals [!Ref CreateS3Endpoint, "true"]
  # Prod-only: the hosted frontend (WebApp, WebBranch; dev uses `mise run dev` on localhost) and
  # database backups and final snapshots (Database).
  IsProd: !Equals [!Ref Stage, prod]

# Single source for the retry count: the ReceiptsQueue redrive policy and the Textract Lambda's
# MAX_RECEIVE_COUNT read the same value, so "last attempt" in the code always matches the point
# at which SQS moves the message to the DLQ.
Mappings:
  Worker:
    Receipts:
      MaxReceiveCount: 3

Globals:
  Function:
    Runtime: python3.14
    CodeUri: packages/api/src/
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        RECEIPTS_BUCKET: !Ref ReceiptsBucket
        POWERTOOLS_SERVICE_NAME: bonbon
        STAGE: !Ref Stage
        # The only origin the API answers with CORS headers (bonbon/http.py)
        ALLOWED_ORIGIN: !If [IsProd, !Sub "https://main.${WebApp.DefaultDomain}", "http://localhost:5173"]

Resources:
  # PostgreSQL on RDS, see docs/decisions/0006 and 0007.
  # Private, reachable only from LambdaSecurityGroup. The Learner Lab allows Single-AZ only,
  # no RDS Proxy and no IAM database auth.
  Database:
    Type: AWS::RDS::DBInstance
    # Prod keeps a final snapshot when the stack is deleted or the instance replaced; dev data is
    # disposable (ADR 0006). Both are CloudFormation attributes: changing them doesn't touch the DB.
    DeletionPolicy: !If [IsProd, Snapshot, Delete]
    UpdateReplacePolicy: !If [IsProd, Snapshot, Delete]
    Properties:
      # A fixed name means CloudFormation can't silently replace the instance on an update,
      # and `mise run db:stop` knows what to stop.
      DBInstanceIdentifier: !Sub bonbon-${Stage}
      Engine: postgres
      EngineVersion: "18.6"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      DBName: bonbon
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
      # Prod: daily backups and point-in-time restore for 7 days. Dev: none, which also makes
      # create and delete faster. Switching between 0 and >0 briefly interrupts the database.
      BackupRetentionPeriod: !If [IsProd, 7, 0]
      DeletionProtection: false
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true

  # Our own subnet group instead of `default`: RDS only creates `default` the first time an
  # instance is launched without one, so fresh Learner Lab accounts don't have it, and the
  # name is reserved, so it can't be created by hand (ADR 0006).
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Default-VPC subnets for bonbon-${Stage}
      SubnetIds: !Ref LambdaSubnetIds

  # Our own secrets without rotation. Not RDS-managed (ManageMasterUserPassword): that one
  # rotates every 7 days and the passwords below are resolved into Lambda environment
  # variables at deploy time, because Secrets Manager isn't reachable from inside the VPC.
  # Known limitation: the password is visible in the Lambda configuration (ADR 0007).
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Bonbon ${Stage} database master user, used only by MigrateFunction
      GenerateSecretString:
        SecretStringTemplate: '{"username": "bonbon_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # The user that API and worker Lambdas connect as (DML only). Created by migration 0001;
  # MigrateFunction sets its password from this secret.
  DbAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Bonbon ${Stage} database app user for API and worker Lambdas
      GenerateSecretString:
        SecretStringTemplate: '{"username": "bonbon_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Lets VPC Lambdas (the database worker) read Textract results from S3 without NAT. Free.
  # Default policy (full S3 access): the endpoint may be shared with other stacks in the VPC.
  # Tagged so stack-params.py recognizes it as ours and keeps CreateS3Endpoint=true.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateS3Endpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: bonbon:stack
          Value: !Ref AWS::StackName

  # Attached to every Lambda that runs in the VPC. Outbound stays open: without a NAT gateway
  # the only reachable targets are the database and S3 (through the gateway endpoint).
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Bonbon ${Stage} Lambdas that use the database
      VpcId: !Ref VpcId

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Bonbon ${Stage} database, PostgreSQL only from the Lambda security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from Bonbon Lambdas
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub bonbon-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      # Stage-wide, for all users together (docs/features/04-households.md). Per-user limits are
      # in the app, e.g. failed join attempts (join_attempts).
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
      # Only the app's own origin: Amplify Hosting on prod, the Vite dev server on dev.
      Cors:
        AllowOrigin: !If [IsProd, !Sub "'https://main.${WebApp.DefaultDomain}'", "'http://localhost:5173'"]
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: Cognito
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          Cognito:
            UserPoolArn: !GetAtt UserPool.Arn
      # Without CORS headers on errors, the browser shows a 401/403 as a CORS error.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If [IsProd, !Sub "'https://main.${WebApp.DefaultDomain}'", "'http://localhost:5173'"]
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If [IsProd, !Sub "'https://main.${WebApp.DefaultDomain}'", "'http://localhost:5173'"]
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"

  # One function per domain; routes inside it are handled by Powertools.
  # Every route in the Python router needs a matching event here.
  # Functions that use the database run in the VPC and hold one connection per container.
  # Keep the sum of their ReservedConcurrentExecutions below max_connections (79):
  # dev: Households 20 + Receipts 20 + Reports 10 + ProcessResult 10 + DeleteCleanup 5 + Migrate 1 = 66;
  # prod: Households 20 + Receipts 10 + Reports 10 + ProcessResult 10 + DeleteCleanup 5 + Migrate 1 = 56.
  HouseholdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.households.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      # Cold start in the VPC plus first DB login takes a few hundred ms; API Gateway stops at 29 s.
      Timeout: 15
      ReservedConcurrentExecutions: 20
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        ListHouseholds:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households
            Method: GET
        CreateHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households
            Method: POST
        GetHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}
            Method: GET
        ListMembers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/members
            Method: GET
        CreateInvite:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/invites
            Method: POST
        JoinHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/join
            Method: POST
        LeaveHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/members/me
            Method: DELETE
        RemoveMember:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/members/{user_id}
            Method: DELETE
        TransferOwnership:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/owner
            Method: PUT

  ReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.receipts.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 15
      ReservedConcurrentExecutions: !If [IsProd, 10, 20]
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        CreateReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts
            Method: POST
        ListReceipts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts
            Method: GET
        GetReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts/{receipt_id}
            Method: GET
        UpdateReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts/{receipt_id}
            Method: PATCH
        ListCategories:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /categories
            Method: GET

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.reports.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 15
      ReservedConcurrentExecutions: 10
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        GetMonthlyReport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/reports/monthly
            Method: GET
        GetSpendingTrend:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/reports/trend
            Method: GET

  # Receipt photos and PDFs. Uploaded by the browser via presigned URL, keys built in
  # bonbon/receipts/storage.py. Every new object becomes an SQS message for the worker.
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    # S3 checks the queue policy when the notification is created.
    DependsOn: ReceiptsQueuePolicy
    Properties:
      # Fixed name so the queue policy can reference it without a circular dependency.
      BucketName: !Sub bonbon-receipts-${Stage}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!If [IsProd, !Sub "https://main.${WebApp.DefaultDomain}", "http://localhost:5173"]]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: glacier-ir-after-30-days
            Status: Enabled
            Transitions:
              - { StorageClass: GLACIER_IR, TransitionInDays: 30 }
          - Id: delete-unprocessed-after-7-days
            Status: Enabled
            TagFilters:
              - { Key: status, Value: pending }
            ExpirationInDays: 7
          # Raw Textract results are read once by the DB worker; expiration wins over the Glacier IR rule
          - Id: delete-textract-results-after-30-days
            Status: Enabled
            Prefix: textract-results/
            ExpirationInDays: 30
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ReceiptsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: households/ }

  ReceiptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReceiptsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ReceiptsBucket.Arn
              - !Sub ${ReceiptsBucket.Arn}/*
            Condition:
              Bool: { aws:SecureTransport: false }

  ReceiptsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-receipts-${Stage}
      # At least 6 x the worker timeout (AWS guidance for Lambda event sources).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReceiptsDeadLetterQueue.Arn
        maxReceiveCount: !FindInMap [Worker, Receipts, MaxReceiveCount]

  ReceiptsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-receipts-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # Second stage of the worker (ADR 0007): the Textract Lambda (outside the VPC) sends the S3
  # key of the stored Textract result here, and the database Lambda (inside the VPC) reads it.
  # No QueuePolicy: unlike ReceiptsQueue (which S3 sends to), this queue is written by a Lambda
  # that runs as LabRole, so it needs no resource policy to allow a service principal.
  ResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-results-${Stage}
      # At least 6 x the database worker's timeout (AWS guidance for Lambda event sources).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ResultsDeadLetterQueue.Arn
        maxReceiveCount: 3

  ResultsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-results-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # Account deletion (feature 05, ADR 0007): DELETE /users/me (outside the VPC) sends the user id
  # here, the deletion worker consumes it. Written by a LabRole Lambda, so no QueuePolicy needed
  # (like ResultsQueue).
  DeletionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-deletion-${Stage}
      # Longer than the orchestrator Lambda's 120 s timeout, so a message stays invisible for the
      # whole invocation and SQS doesn't redeliver it while the worker is still running
      # (nesting: cleanup 60 < lambda read 70 < orchestrator 120 < visibility 180).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeletionDeadLetterQueue.Arn
        maxReceiveCount: 3

  DeletionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-deletion-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # A deletion job that failed every retry waits in the DLQ for someone to look at it. The alarm
  # makes that visible in CloudWatch; no action is wired to it (the stack has no SNS topic).
  DeletionDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub bonbon-deletion-dlq-${Stage}
      AlarmDescription: A failed account-deletion job is sitting in the deletion DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeletionDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching

  # A resource policy on the queue, not an IAM policy, so it is allowed in the Learner Lab.
  ReceiptsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ReceiptsQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ReceiptsQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3:::bonbon-receipts-${Stage}-${AWS::AccountId}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Account deletion endpoint (feature 05). Outside the VPC, because it calls Cognito and SQS,
  # which VPC Lambdas can't reach (ADR 0007). No DB_* vars and no VpcConfig: it never touches the
  # database, so it doesn't count towards the 79-connection limit. The worker (inside the VPC)
  # does the data cleanup.
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.users.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 15
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          DELETION_QUEUE_URL: !Ref DeletionQueue
      Events:
        DeleteAccount:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/me
            Method: DELETE

  # Account deletion worker (feature 05, ADR 0007). Outside the VPC, triggered by the deletion
  # queue: it invokes the cleanup function (inside the VPC) for the database and S3 work, then
  # deletes the Cognito account. Timeouts nest (cleanup 60 < lambda read_timeout 70 < this 120 <
  # queue visibility 180), so a stuck cleanup surfaces as a FunctionError, not a lost message.
  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.delete_account.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 120
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLEANUP_FUNCTION_NAME: !Ref DeleteCleanupFunction
      Events:
        DeletionJob:
          Type: SQS
          Properties:
            Queue: !GetAtt DeletionQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Cleanup function for account deletion (feature 05). Inside the VPC for the database and S3
  # (gateway endpoint); it can't reach Cognito, so the worker above does that part. Invoked
  # synchronously by DeleteAccountFunction, so it has no event source of its own. One connection
  # per container, so its ReservedConcurrentExecutions counts towards the 79-connection limit.
  DeleteCleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.delete_cleanup.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 60
      ReservedConcurrentExecutions: 5
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"

  ProcessReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.process_receipt.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      # Keeps Textract below its rate limit (5 calls/s); SQS buffers the rest.
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          RESULTS_QUEUE_URL: !Ref ResultsQueue
          # Same value as the queue's maxReceiveCount, so the last-attempt failure message is
          # sent on the delivery that SQS would otherwise drop to the DLQ.
          MAX_RECEIVE_COUNT: !FindInMap [Worker, Receipts, MaxReceiveCount]
          TEXTRACT_MOCK: !If [IsProd, "0", !Ref TextractMock]
          TEXTRACT_MOCK_DELAY_MS: !Ref TextractMockDelayMs
      Events:
        ReceiptUploaded:
          Type: SQS
          Properties:
            Queue: !GetAtt ReceiptsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Second stage of the worker (ADR 0007): reads a Textract result key from ResultsQueue, then
  # (later) reads the JSON from S3, categorizes the items and writes the receipt to PostgreSQL.
  # Runs in the VPC because it talks to the database; it holds one connection per container, so
  # its ReservedConcurrentExecutions counts towards the 79-connection limit (sum above HouseholdsFunction).
  ProcessResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.process_result.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      ReservedConcurrentExecutions: 10
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        TextractResult:
          Type: SQS
          Properties:
            Queue: !GetAtt ResultsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Applies src/bonbon/migrations/*.sql. Invoked by `mise run db:migrate`, not by API Gateway.
  # The only function with the master user.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.migrate.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 120
      # Two migrations must never run at the same time.
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
          DB_APP_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_APP_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-monitoring
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway latency (p95)",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "${AWS::StackName}", "Stage", "api", {"stat": "p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "API Gateway requests and errors",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}", "Stage", "api", {"stat": "SampleCount"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}", "Stage", "api", {"stat": "Sum"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}", "Stage", "api", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Worker invocations, errors and throttles",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ProcessReceiptFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ProcessReceiptFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${ProcessReceiptFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ProcessResultFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ProcessResultFunction}", {"stat": "Sum"}],
                  ["AWS/Lambda", "Throttles", "FunctionName", "${ProcessResultFunction}", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Worker duration (p95)",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ProcessReceiptFunction}", {"stat": "p95"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${ProcessResultFunction}", {"stat": "p95"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Worker concurrent executions",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ProcessReceiptFunction}", {"stat": "Maximum"}],
                  ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ProcessResultFunction}", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "Work queue visible messages",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ReceiptsQueue.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResultsQueue.QueueName}", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Work queue oldest message age (seconds)",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${ReceiptsQueue.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${ResultsQueue.QueueName}", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Dead-letter queue visible messages",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ReceiptsDeadLetterQueue.QueueName}", {"stat": "Maximum"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResultsDeadLetterQueue.QueueName}", {"stat": "Maximum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Textract AnalyzeExpense (account/region-wide; active mock: simulated throttling not reflected)",
                "view": "timeSeries", "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  ["AWS/Textract", "SuccessfulRequestCount", "Operation", "AnalyzeExpense", {"stat": "Sum"}],
                  ["AWS/Textract", "ThrottledCount", "Operation", "AnalyzeExpense", {"stat": "Sum"}]
                ]
              }
            }
          ]
        }

  # The built React app (packages/web/dist), on Amplify Hosting (ADR 0008). Prod only.
  # The Learner Lab denies every CloudFront call, so S3 + our own distribution isn't possible.
  # Amplify serves over HTTPS from its own managed storage, so no bucket is public. No
  # IAMServiceRole: `mise run deploy:web` uploads a zip, Amplify never builds from Git.
  WebApp:
    Type: AWS::Amplify::App
    Condition: IsProd
    Properties:
      Name: !Sub bonbon-${Stage}
      Platform: WEB
      # Client-side routes (BrowserRouter) aren't files: every path without a file extension
      # serves index.html with status 200, and the router takes over.
      CustomRules:
        - Source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>"
          Target: /index.html
          Status: "200"

  WebBranch:
    Type: AWS::Amplify::Branch
    Condition: IsProd
    Properties:
      AppId: !GetAtt WebApp.AppId
      BranchName: main
      Stage: PRODUCTION

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/api
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  DbInstanceId:
    Value: !Ref Database
  WebUrl:
    Condition: IsProd
    Value: !Sub https://main.${WebApp.DefaultDomain}
  WebAppId:
    Condition: IsProd
    Value: !GetAtt WebApp.AppId
