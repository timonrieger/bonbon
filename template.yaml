AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bonbon, receipt digitization for shared households

# Learner Lab rules (see docs/decisions/0001-learner-lab-constraints.md):
# - NEVER create IAM roles or policies (no AWS::IAM::*, no `Policies:` on functions).
#   Every function must set `Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole`
#   (SAM does not allow Role in Globals; .mise/tasks/check-no-iam.py enforces this).
# - Region is always us-east-1.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  # The database and the Lambdas that use it live in the account's default VPC (only the
  # `default` DB subnet group works in the Learner Lab). Looked up by .mise/tasks/stack-params.py.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The account's default VPC
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Default-VPC subnets for Lambdas (without use1-az3, which Lambda doesn't support)

Globals:
  Function:
    Runtime: python3.14
    CodeUri: packages/api/src/
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        RECEIPTS_BUCKET: !Ref ReceiptsBucket
        POWERTOOLS_SERVICE_NAME: bonbon
        STAGE: !Ref Stage

Resources:
  # Single table for all data, see docs/architecture.md#data-model.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bonbon-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true

  # PostgreSQL on RDS, see docs/decisions/0006 and 0007.
  # Private, reachable only from LambdaSecurityGroup. The Learner Lab allows only the
  # `default` DB subnet group, Single-AZ, no RDS Proxy and no IAM database auth.
  Database:
    Type: AWS::RDS::DBInstance
    # Dev data is disposable. Switch both to Snapshot before the first prod deploy (ADR 0006).
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # A fixed name means CloudFormation can't silently replace the instance on an update,
      # and `mise run db:stop` knows what to stop.
      DBInstanceIdentifier: !Sub bonbon-${Stage}
      Engine: postgres
      EngineVersion: "18.6"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: default
      VPCSecurityGroups: [!GetAtt DbSecurityGroup.GroupId]
      DBName: bonbon
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
      BackupRetentionPeriod: 0
      DeletionProtection: false
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true

  # Our own secrets without rotation. Not RDS-managed (ManageMasterUserPassword): that one
  # rotates every 7 days and the passwords below are resolved into Lambda environment
  # variables at deploy time, because Secrets Manager isn't reachable from inside the VPC.
  # Known limitation: the password is visible in the Lambda configuration (ADR 0007).
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Bonbon ${Stage} database master user, used only by MigrateFunction
      GenerateSecretString:
        SecretStringTemplate: '{"username": "bonbon_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # The user that API and worker Lambdas connect as (DML only). Created by migration 0001;
  # MigrateFunction sets its password from this secret.
  DbAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Bonbon ${Stage} database app user for API and worker Lambdas
      GenerateSecretString:
        SecretStringTemplate: '{"username": "bonbon_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Attached to every Lambda that runs in the VPC. Outbound stays open: without a NAT gateway
  # the only reachable targets are the database (and later the S3 gateway endpoint).
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Bonbon ${Stage} Lambdas that use the database
      VpcId: !Ref VpcId

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Bonbon ${Stage} database, PostgreSQL only from the Lambda security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from Bonbon Lambdas
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub bonbon-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: Cognito
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          Cognito:
            UserPoolArn: !GetAtt UserPool.Arn
      # Without CORS headers on errors, the browser shows a 401/403 as a CORS error.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"

  # One function per domain; routes inside it are handled by Powertools.
  # Every route in the Python router needs a matching event here.
  # Functions that use the database run in the VPC and hold one connection per container.
  # Keep the sum of their ReservedConcurrentExecutions well below max_connections (79):
  # today Households 20 + Receipts 10 + Reports 10 + Migrate 1 = 41.
  HouseholdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.households.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      # Cold start in the VPC plus first DB login takes a few hundred ms; API Gateway stops at 29 s.
      Timeout: 15
      ReservedConcurrentExecutions: 20
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        CreateHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households
            Method: POST
        GetHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}
            Method: GET

  ReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.receipts.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 15
      ReservedConcurrentExecutions: 10
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        ListReceipts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts
            Method: GET
        GetReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/receipts/{receipt_id}
            Method: GET

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.reports.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 15
      ReservedConcurrentExecutions: 10
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"
      Events:
        GetMonthlyReport:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/reports/monthly
            Method: GET
        GetSpendingTrend:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /households/{household_id}/reports/trend
            Method: GET

  # Receipt photos and PDFs. Uploaded by the browser via presigned URL, keys built in
  # bonbon/receipts/storage.py. Every new object becomes an SQS message for the worker.
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    # S3 checks the queue policy when the notification is created.
    DependsOn: ReceiptsQueuePolicy
    Properties:
      # Fixed name so the queue policy can reference it without a circular dependency.
      BucketName: !Sub bonbon-receipts-${Stage}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: glacier-ir-after-30-days
            Status: Enabled
            Transitions:
              - { StorageClass: GLACIER_IR, TransitionInDays: 30 }
          - Id: delete-unprocessed-after-7-days
            Status: Enabled
            TagFilters:
              - { Key: status, Value: pending }
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ReceiptsQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: households/ }

  ReceiptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReceiptsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ReceiptsBucket.Arn
              - !Sub ${ReceiptsBucket.Arn}/*
            Condition:
              Bool: { aws:SecureTransport: false }

  ReceiptsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-receipts-${Stage}
      # At least 6 x the worker timeout (AWS guidance for Lambda event sources).
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReceiptsDeadLetterQueue.Arn
        maxReceiveCount: 3

  ReceiptsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bonbon-receipts-dlq-${Stage}
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # A resource policy on the queue, not an IAM policy, so it is allowed in the Learner Lab.
  ReceiptsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ReceiptsQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt ReceiptsQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:s3:::bonbon-receipts-${Stage}-${AWS::AccountId}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ProcessReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.process_receipt.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 30
      # Keeps Textract below its rate limit (5 calls/s); SQS buffers the rest.
      ReservedConcurrentExecutions: 10
      Events:
        ReceiptUploaded:
          Type: SQS
          Properties:
            Queue: !GetAtt ReceiptsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  # Applies src/bonbon/migrations/*.sql. Invoked by `mise run db:migrate`, not by API Gateway.
  # The only function with the master user.
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bonbon.handlers.migrate.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Timeout: 120
      # Two migrations must never run at the same time.
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_NAME: bonbon
          DB_USER: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
          DB_APP_USER: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:username}}"
          DB_APP_PASSWORD: !Sub "{{resolve:secretsmanager:${DbAppSecret}:SecretString:password}}"

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/api
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  DbInstanceId:
    Value: !Ref Database
