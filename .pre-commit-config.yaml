# Run by prek (https://prek.j178.dev) on every commit; `mise run lint` runs it on all files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-json
        # tsconfig is JSONC (comments allowed), not strict JSON
        exclude: tsconfig\.json$
      - id: check-yaml
        # CloudFormation tags (!Ref, !Sub, …) aren't plain YAML; cfn-lint checks the template
        exclude: ^template\.yaml$
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --config, packages/api/pyproject.toml]
      - id: ruff-format
        args: [--config, packages/api/pyproject.toml]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 033aa05ea3f6f5f7cd39bcb6a31fd66f6efbed2f  # frozen: v0.0.89
    hooks:
      - id: ty
        args: [--project, packages/api, --python, packages/api/.venv]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db  # frozen: 0.13.1
    hooks:
      - id: uv-lock
        args: [--project, packages/api]
        files: ^packages/api/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        files: ^packages/api/src/

  - repo: https://github.com/biomejs/pre-commit
    rev: 5090c1e080cc8cec15feee68a9355c0f660d3712  # frozen: v2.5.15
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.15"]

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: be66fb3e224b41c85065cb3002ad0b24e31db535  # frozen: v1.57.2
    hooks:
      - id: cfn-lint
        files: ^template\.yaml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013] # ignore line length
        exclude: ^docs/project/ # converted from Word, not ours to lint

  - repo: local
    hooks:
      - id: web-typecheck
        name: web typecheck
        language: system
        entry: mise run //packages/web:typecheck
        files: ^packages/web/
        pass_filenames: false

      # Keeps openapi.json and the frontend client in sync with the Python routes.
      # If this modifies files, review and `git add` them, then commit again.
      - id: api-client
        name: regenerate API client
        language: system
        entry: mise run generate
        files: ^packages/api/src/
        pass_filenames: false

      - id: no-iam
        name: no IAM resources (Learner Lab, use LabRole)
        language: system
        entry: mise run check-no-iam
        files: ^template\.yaml$
        pass_filenames: false
