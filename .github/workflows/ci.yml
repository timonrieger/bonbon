name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No deploys from CI: Learner Lab credentials expire every few hours, so they
# can't live in GitHub secrets. Prod is deployed with `mise run deploy:prod`.
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, test]
    steps:
      - name: Check-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Run ${{ matrix.task }}
        run: mise run '${{ matrix.task }}'

      - name: Generated API client is up to date
        if: matrix.task == 'lint'
        run: |
          mise run generate
          git diff --exit-code -- packages/api/openapi.json packages/web/src/api/client.gen.ts
