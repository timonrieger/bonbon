<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Receipt image browser tests</title>
  <pre id="result">PENDING</pre>
  <section id="samples" aria-label="Receipt text at native output size"></section>
  <script type="module">
    import { prepareReceiptImage, RECEIPT_IMAGE_TYPES } from '../src/features/receipts/receiptImage.ts';

    const report = document.querySelector('#result');
    const samples = document.querySelector('#samples');
    const results = [];
    const target = 500 * 1024;
    const limit = 5 * 1024 * 1024;

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    async function expectError(operation, pattern) {
      try {
        await operation();
      } catch (error) {
        assert(pattern.test(error.message), error.message);
        return;
      }
      throw new Error('Expected rejection');
    }

    function canvas(width, height) {
      const element = document.createElement('canvas');
      element.width = width;
      element.height = height;
      return element;
    }

    async function fixture(width, height, type, textureRange = 0) {
      const source = canvas(width, height);
      const context = source.getContext('2d');
      if (textureRange > 0) {
        const texture = context.createImageData(width, height);
        let seed = 17;
        for (let y = 16; y < height - 16; y++) {
          for (let x = 16; x < width - 16; x++) {
            seed = Math.imul(seed, 1664525) + 1013904223;
            const value = 245 - ((seed >>> 24) % textureRange);
            const offset = (y * width + x) * 4;
            texture.data.set([value, value, value, 255], offset);
          }
        }
        context.putImageData(texture, 0, 0);
      }

      context.fillStyle = '#fff';
      context.fillRect(18, 48, 218, 48);
      context.fillStyle = '#202020';
      context.font = '24px monospace';
      context.fillText('MILCH CHF 2.50', 28, 80);

      const blob = await new Promise((resolve) => source.toBlob(resolve, type, 1));
      return new File([blob], 'receipt', { type });
    }

    function prepare(file, signal = new AbortController().signal) {
      return prepareReceiptImage(file, signal);
    }

    function checkText(bitmap, scale) {
      // Draw a crop at 1:1 so it can also be inspected in the browser at 100% zoom.
      const crop = canvas(Math.round(218 * scale), Math.round(48 * scale));
      const context = crop.getContext('2d');
      context.drawImage(bitmap, -Math.round(18 * scale), -Math.round(48 * scale));
      const { data } = context.getImageData(0, 0, crop.width, crop.height);
      const darkColumns = new Set();
      const darkRows = new Set();
      for (let y = 4; y < crop.height - 4; y++) {
        for (let x = 3; x < crop.width - 3; x++) {
          if (data[(y * crop.width + x) * 4] < 90) {
            darkColumns.add(x);
            darkRows.add(y);
          }
        }
      }
      assert(darkRows.size >= 10 && darkColumns.size >= 38, 'Text lost dark strokes at native size');
      samples.append(crop);
    }

    async function run() {
      for (const type of RECEIPT_IMAGE_TYPES) {
        const small = await fixture(220, 330, type);
        const unchanged = await prepare(small);
        assert(unchanged.file === small && unchanged.contentType === type, 'Small image changed');
        results.push(`Small ${type}: ${small.size} bytes unchanged`);

        for (const [width, height] of [[3200, 1600], [1500, 3300], [850, 5000]]) {
          const source = await fixture(width, height, type, type === 'image/png' ? 8 : 45);
          assert(source.size > target && source.size <= limit, `Fixture size: ${source.size}`);
          const output = await prepare(source);
          assert(output.contentType === 'image/jpeg' && output.file.type === output.contentType, 'Incorrect output MIME type');
          assert(output.file.size <= limit && output.file.size < source.size * 0.9, 'Large image was not reduced');
          const bitmap = await createImageBitmap(output.file);
          const scale = bitmap.width / width;
          assert(bitmap.width < width && bitmap.height < height, 'Large image was not resized');
          assert(Math.abs(bitmap.height * width - bitmap.width * height) <= width + height, 'Aspect ratio changed');
          if (width === 850) {
            assert(bitmap.width >= Math.round(width * 0.75), 'Narrow receipt lost too much width');
          }
          checkText(bitmap, scale);
          if (type === 'image/png') {
            const context = canvas(1, 1).getContext('2d');
            context.drawImage(bitmap, 0, 0);
            assert(context.getImageData(0, 0, 1, 1).data.every((value) => value >= 245), 'Transparency was not composited over white');
          }
          results.push(`${type} ${width}×${height} → ${bitmap.width}×${bitmap.height}, ${source.size} → ${output.file.size} bytes`);
          bitmap.close();
        }
      }

      const lightlyTextured = await fixture(1500, 2600, 'image/png', 8);
      const nearTarget = await prepare(lightlyTextured);
      assert(lightlyTextured.size > target && nearTarget.file.size <= target, 'Lightly textured receipt missed the target');
      results.push(`Lightly textured PNG: ${lightlyTextured.size} → ${nearTarget.file.size} bytes`);

      const jpeg = await fixture(3200, 1600, 'image/jpeg', 45);
      // EXIF orientation 6 rotates the source 90 degrees clockwise.
      const exif = new Uint8Array([255, 225, 0, 34, 69, 120, 105, 102, 0, 0, 73, 73, 42, 0, 8, 0, 0, 0, 1, 0, 18, 1, 3, 0, 1, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0]);
      const rotated = new File([jpeg.slice(0, 2), exif, jpeg.slice(2)], 'rotated.jpg', { type: jpeg.type });
      const oriented = await createImageBitmap((await prepare(rotated)).file);
      assert(oriented.height === oriented.width * 2 && oriented.height < 3200, 'EXIF rotation lost');
      results.push(`EXIF orientation: ${oriented.width}×${oriented.height}`);
      oriented.close();

      for (const type of RECEIPT_IMAGE_TYPES) {
        const oversized = new File([new Uint8Array(limit + 1)], 'oversized', { type });
        await expectError(() => prepare(oversized), /höchstens 5 MB/);
      }

      const controller = new AbortController();
      const encode = HTMLCanvasElement.prototype.toBlob;
      try {
        HTMLCanvasElement.prototype.toBlob = function (callback, ...args) {
          controller.abort();
          encode.call(this, callback, ...args);
        };
        await expectError(() => prepare(jpeg, controller.signal), /aborted/i);
      } finally {
        HTMLCanvasElement.prototype.toBlob = encode;
      }
      results.push('Both oversized formats rejected; abort during encoding propagated');
    }

    run().then(() => {
      report.textContent = ['PASS', ...results].join('\n');
    }).catch((error) => {
      report.textContent = ['FAIL', ...results, error.stack].join('\n');
    });
  </script>
</html>
