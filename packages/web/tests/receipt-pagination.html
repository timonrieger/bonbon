<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt item pagination browser tests</title>
  <div id="app"></div>
  <pre id="result" class="fixed inset-x-0 bottom-0 z-10 max-h-32 overflow-auto bg-white p-2">PENDING</pre>
  <script type="module">
    import { Authenticator } from '@aws-amplify/ui-react';
    import { useQueryClient } from '@tanstack/react-query';
    import { Amplify } from 'aws-amplify';
    import { cognitoUserPoolsTokenProvider } from 'aws-amplify/auth/cognito';
    import { createElement, StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';
    import { MemoryRouter, useNavigate } from 'react-router';
    import { App } from '@/App';
    import { defaults, Status } from '@/api';
    import { formatRappen } from '@/api/receipts';
    import { AuthenticatedSession } from '@/components/AuthenticatedSession';
    import { householdAccessKey } from '@/features/households/householdAccess';
    import '../src/index.css';

    const host = document.querySelector('#app');
    const report = document.querySelector('#result');
    const results = [];
    const userId = 'correction-fixture-member';
    const clientId = 'fixtureclient';
    const key = `CognitoIdentityServiceProvider.${clientId}`;
    const now = Math.floor(Date.now() / 1000);
    const jwt = `e30.${btoa(JSON.stringify({ sub: userId, 'cognito:username': userId, iat: now, exp: now + 3600 }))}.fixture`;
    const tokens = new Map([
      [`${key}.LastAuthUser`, userId],
      [`${key}.${userId}.accessToken`, jwt],
      [`${key}.${userId}.idToken`, jwt]
    ]);
    Amplify.configure({ Auth: { Cognito: { userPoolId: 'us-east-1_fixture', userPoolClientId: clientId } } });
    cognitoUserPoolsTokenProvider.setKeyValueStorage({
      async getItem(name) { return tokens.get(name) ?? null; },
      async setItem(name, value) { tokens.set(name, value); },
      async removeItem(name) { tokens.delete(name); },
      async clear() { tokens.clear(); }
    });

    const date = '2026-11-28T12:00:00Z';
    const total = 98765;
    const category = 'Lebensmittel';
    const items = Array.from({ length: 41 }, (_, index) => ({
      position: 2 * index + 1, name: `Item ${index + 1}`, quantity: index % 3 + 1,
      unit_price_rappen: index % 2 ? null : 125 + index, amount_rappen: index - 50,
      category: index % 2 ? 'Sonstiges' : category
    }));
    const fixtures = new Map([0, 1, 19, 20, 21, 40, 41].map(count => [String(count), items.slice(0, count)]));
    const path = (id, household = 'h') => `/households/${household}/receipts/${id}`;
    const detailKey = ['receipt', 'other', '41'];
    let membership = true;
    let holdDetail = false;
    let delayed;
    let savedItems;
    let detailReads = 0;
    let client;
    let navigate;
    defaults.baseUrl = 'https://api.invalid';
    const originalFetch = window.fetch;
    window.fetch = async (input, init) => {
      const url = new URL(String(input), location.href);
      if (url.origin !== defaults.baseUrl) return originalFetch(input, init);
      assert(new Headers(init.headers).get('Authorization') === jwt, 'Missing fixture session');
      if (url.pathname === '/categories') return Response.json({ categories: [category, 'Sonstiges'] });
      const [, , household, resource, id] = url.pathname.split('/');
      const allowed = household === 'h' || (household === 'other' && membership);
      if (!resource) {
        return allowed
          ? Response.json({ id: household, name: 'Fixture household', my_role: 'member', created_at: date })
          : Response.json({}, { status: 404 });
      }
      assert(resource === 'receipts' && allowed && fixtures.has(id), 'Unexpected receipt request');
      if (init.method === 'PATCH') {
        savedItems = JSON.parse(init.body).items;
        fixtures.set(id, savedItems);
      } else {
        detailReads++;
      }
      const response = Response.json({
        id, status: Status.Done, store: `Fixture ${household}/${id}`, created_at: date,
        purchase_date: null, total_rappen: total, uploaded_by_name: 'Other member',
        possible_duplicate: false, image_url: '', items: fixtures.get(id)
      });
      if (holdDetail) {
        holdDetail = false;
        await new Promise(resolve => { delayed = { signal: init.signal, release: resolve }; });
        delayed.delivered = true;
      }
      return response;
    };

    function Fixture() {
      client = useQueryClient();
      navigate = useNavigate();
      return createElement(App);
    }
    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }
    async function until(predicate, message, timeout = 5000) {
      const deadline = Date.now() + timeout;
      while (!predicate()) {
        assert(Date.now() < deadline, message);
        await new Promise(resolve => setTimeout(resolve, 20));
      }
    }
    function pass(message) {
      results.push(message);
      report.textContent = results.join('\n');
    }
    const table = () => host.querySelector('[aria-label="Belegpositionen"]');
    const rows = () => [...host.querySelectorAll('[aria-label="Belegpositionen"] tbody tr')];
    const nav = () => host.querySelector('nav[aria-label="Seitennavigation der Belegpositionen"]');
    const pageLabel = () => nav()?.querySelector('[aria-live="polite"]')?.textContent;
    const back = () => nav()?.querySelector('button:first-child');
    const next = () => nav()?.querySelector('button:last-child');
    const form = () => host.querySelector('form[aria-label="Kassenzettel korrigieren"]');
    const correction = () => [...host.querySelectorAll('button')].find(
      button => button.textContent.trim() === 'Kassenzettel korrigieren'
    );
    async function go(id, household = 'h') {
      navigate(path(id, household));
      await until(() => host.textContent.includes(`Fixture ${household}/${id}`), `Receipt ${household}/${id} did not load`);
    }
    async function checkPage(id, page, pages) {
      const expected = fixtures.get(id).slice((page - 1) * 20, page * 20);
      await until(() => rows().length === expected.length &&
        (pages === 1 ? !nav() : pageLabel() === `Seite ${page} von ${pages}`), `Wrong page ${page} for ${id} items`);
      rows().forEach((row, index) => {
        const item = expected[index];
        const cells = [...row.cells].map(cell => cell.textContent.trim());
        assert(JSON.stringify(cells) === JSON.stringify([
          item.name, String(item.quantity), formatRappen(item.unit_price_rappen),
          formatRappen(item.amount_rappen), item.category
        ]), `Wrong data or order at position ${item.position}`);
      });
      assert([...host.querySelectorAll('dl dd')].some(dd => dd.textContent === formatRappen(total)),
        'Receipt total changed while paginating');
      if (pages > 1) {
        assert(back().textContent.trim() === 'Zurück' && next().textContent.trim() === 'Weiter', 'Wrong button labels');
        assert(back().disabled === (page === 1) && next().disabled === (page === pages), 'Wrong disabled state');
      }
    }

    async function run() {
      createRoot(host).render(createElement(StrictMode, null, createElement(Authenticator, null,
        createElement(AuthenticatedSession, null,
          createElement(MemoryRouter, { initialEntries: [path('0')] }, createElement(Fixture))
        )
      )));
      await until(() => host.textContent.includes('Keine Positionen vorhanden.'), 'Missing existing empty state');
      await checkPage('0', 1, 1);
      for (const id of ['1', '19', '20']) {
        await go(id);
        await checkPage(id, 1, 1);
      }
      pass('Empty and single-page receipts: 0, 1, 19 and 20 items');

      for (const id of ['21', '40', '41']) {
        await go(id);
        const reads = detailReads;
        const pages = Math.ceil(Number(id) / 20);
        await checkPage(id, 1, pages);
        for (let page = 2; page <= pages; page++) {
          next().click();
          await checkPage(id, page, pages);
        }
        for (let page = pages - 1; page >= 1; page--) {
          back().click();
          await checkPage(id, page, pages);
        }
        assert(detailReads === reads, 'Page navigation triggered a receipt request');
      }
      pass('21, 40 and 41 items: forward and back, boundaries, order, table data and total');

      assert(!table().contains(nav()) && document.documentElement.scrollWidth <= innerWidth,
        'Pagination is inside table scroll area or page overflows');
      for (const control of [back(), next(), nav().querySelector('p')]) {
        const rect = control.getBoundingClientRect();
        assert(rect.left >= 0 && rect.right <= innerWidth, 'Pagination control overflows');
      }
      let trustedActivations = 0;
      nav().addEventListener('click', event => {
        if (event.isTrusted && event.detail === 0) trustedActivations++;
      });
      table().focus();
      report.textContent += '\nREADY: Tab to Weiter. Press Enter once at each prompt.';
      for (const [page, focus] of [[2, next], [3, back], [2, back], [1, next]]) {
        await until(() => pageLabel() === `Seite ${page} von 3`, 'Expected a native Enter key activation', 60000);
        assert(document.activeElement === focus(), 'Focus was lost when changing pages');
        report.textContent += `\nPage ${page}. ${page === 1 ? 'Keyboard checks complete.' : 'Press Enter again.'}`;
      }
      assert(trustedActivations === 4, 'Expected four native keyboard activations');
      pass(`Responsive layout and keyboard focus at ${innerWidth}×${innerHeight}`);

      async function editFromLastPage() {
        next().click();
        await checkPage('41', 2, 3);
        next().click();
        await checkPage('41', 3, 3);
        correction().click();
        await until(form, 'Correction did not open');
        assert(!nav() && form().querySelectorAll('tbody tr').length === 41, 'Correction did not receive all items');
      }

      await editFromLastPage();
      form().querySelector('button[type="button"]').click();
      await checkPage('41', 1, 3);
      await editFromLastPage();
      const name = form().querySelector('tbody tr:last-child input');
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(name, 'Corrected last item');
      name.dispatchEvent(new Event('input', { bubbles: true }));
      const submit = form().querySelector('button[type="submit"]');
      await until(() => !submit.disabled, 'Correction did not become saveable');
      submit.click();
      await checkPage('41', 1, 3);
      assert(savedItems?.length === 41 && savedItems.every((item, index) => {
        const expected = { ...items[index], name: index === 40 ? 'Corrected last item' : items[index].name };
        return Object.keys(expected).every(key => item[key] === expected[key]);
      }), 'PATCH did not preserve the full ordered list or the last-item correction');
      pass('All 41 items in correction and PATCH, with page reset after cancel and save');

      next().click();
      await checkPage('41', 2, 3);
      await go('40');
      await checkPage('40', 1, 2);
      await go('41');
      await checkPage('41', 1, 3);
      next().click();
      await checkPage('41', 2, 3);
      await go('41', 'other');
      await checkPage('41', 1, 3);
      pass('Page reset on receipt change and household change with the same receipt ID');

      next().click();
      await checkPage('41', 2, 3);
      next().click();
      await checkPage('41', 3, 3);
      const fullList = fixtures.get('41');
      fixtures.set('41', fullList.slice(0, 21));
      await client.refetchQueries({ queryKey: detailKey });
      await checkPage('41', 2, 2);
      fixtures.set('41', fullList);
      await client.refetchQueries({ queryKey: detailKey });
      await checkPage('41', 2, 3);
      pass('Shorter refetch clamps the page, and a later longer response keeps it');

      holdDetail = true;
      const pending = client.refetchQueries({ queryKey: detailKey });
      await until(() => delayed, 'Stale detail request did not start');
      membership = false;
      const accessKey = householdAccessKey('other');
      await client.invalidateQueries({ queryKey: accessKey });
      await until(() => !nav() && !table(), 'Private table or navigation survived revocation');
      assert(delayed.signal.aborted, 'Revocation did not abort the private request');
      delayed.release();
      await pending;
      await until(() => delayed.delivered, 'Late response was not released');
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      assert(!nav() && !table() && client.getQueryData(detailKey) == null && client.getQueryData(accessKey) === null,
        'Late response restored unauthorized DOM or cache data');
      pass('Access revocation removes private rows and controls, even after a late response');
    }

    run().then(() => {
      report.textContent = [`PASS (${results.length} groups)`, ...results].join('\n');
    }).catch(error => {
      report.textContent = ['FAIL', ...results, error.stack].join('\n');
    });
  </script>
</html>
